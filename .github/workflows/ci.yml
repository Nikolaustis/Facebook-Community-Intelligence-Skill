name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check scripts/phase1_collect_candidates.js
      - run: node --check scripts/phase2_collect_details.js
      - run: node --check scripts/group_name_utils.js
      - run: node --check scripts/finalize_partial_xlsx.js
      - run: node --check scripts/repair_avatar_name_pollution_xlsx.js
      - run: node --check scripts/facebook_metrics_parser.js
      - run: node --check scripts/collector_reliability_patcher.js
      - run: node --check scripts/run_collector_reliable.js
      - run: node --check scripts/doctor.js
      - run: node --check scripts/validate_login_state.js
      - name: Parse PowerShell entrypoints
        shell: powershell
        run: |
          [scriptblock]::Create((Get-Content -Raw .\scripts\open_chrome_9222.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw .\scripts\run_multi_games_reliable.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw .\scripts\start_background_task.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw .\scripts\start_background_reliable.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw .\scripts\scheduled_phase2_runner_reliable.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw .\scripts\queue_phase2_after_current_reliable.ps1)) | Out-Null
