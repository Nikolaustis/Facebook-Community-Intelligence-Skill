name: Project metadata cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/project_metadata_cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove project release metadata and stale files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $phase1 = Join-Path $PWD "scripts\phase1_collect_candidates.js"
          if (-not (Test-Path $phase1)) {
            throw "Missing scripts\phase1_collect_candidates.js"
          }

          $text = [System.IO.File]::ReadAllText($phase1)

          # Remove project release metadata from Phase 1 diagnostics and index output.
          $text = [regex]::Replace(
            $text,
            '(?m)^\s{4}version:\s*[''"][^''"]+[''"],\s*\r?\n',
            ""
          )
          $text = [regex]::Replace(
            $text,
            '(?m)^\s{6}skill_version:\s*[''"][^''"]+[''"],\s*\r?\n',
            ""
          )

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($phase1, $text, $utf8NoBom)

          # Remove delivery/migration artifacts that should not remain in the public repository.
          $deliveryArtifacts = @(
            "APPLY_PROJECT_METADATA_CLEANUP.ps1",
            "使用说明.md"
          )

          foreach ($relative in $deliveryArtifacts) {
            $target = Join-Path $PWD $relative
            if (Test-Path $target) {
              Remove-Item -LiteralPath $target -Force
              Write-Host "Removed delivery artifact: $relative"
            }
          }

          # Remove files whose basename encodes a project release identifier.
          # Dependency versions inside package-lock.json are intentionally untouched.
          $skipRoots = @(".git", "node_modules", "runs")
          $releaseNamePattern = "(?i)(^|[_\-.])v\d+(?:\.\d+){0,2}(?=$|[_\-.])"

          $files = Get-ChildItem -LiteralPath $PWD -Recurse -File -Force | Where-Object {
            $relative = $_.FullName.Substring($PWD.Path.Length).TrimStart('\', '/')
            $first = ($relative -split '[\\/]')[0]
            $skipRoots -notcontains $first
          }

          foreach ($file in $files) {
            if ($file.Name -match $releaseNamePattern) {
              $relative = $file.FullName.Substring($PWD.Path.Length).TrimStart('\', '/')
              Remove-Item -LiteralPath $file.FullName -Force
              Write-Host "Removed release-encoded filename: $relative"
            }
          }

          # Hard verification before tests.
          $phase1After = [System.IO.File]::ReadAllText($phase1)
          if ($phase1After -match "\bskill_version\b") {
            throw "skill_version still exists in Phase 1 source."
          }
          if ($phase1After -match '(?m)^\s*version:\s*[''"][^''"]+[''"],?\s*$') {
            throw "Project version metadata still exists in Phase 1 diagnostics."
          }

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Syntax check collectors
        shell: pwsh
        run: |
          node --check scripts/phase1_collect_candidates.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/phase2_collect_details.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit cleaned repository state
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "No cleanup changes remain to commit."
            exit 0
          }

          git commit -m "chore: remove project release metadata"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git push
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
