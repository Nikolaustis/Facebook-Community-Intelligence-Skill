interface:
  display_name: Facebook Community Intelligence
  short_description: Subject-centric Facebook Group intelligence with Community/Match normalization, reliable collection, evaluation, and audited export
  default_prompt: >-
    使用 Facebook Community Intelligence 流程。优先采用 Subject / Community / Match 数据模型：Subject 可以是游戏、品牌、产品、应用、创作者、公司、主题、事件、竞品或自定义对象；Facebook Group 作为唯一 Community 实体，按规范化 URL 去重，Community 证据与 Subject 匹配关系分离。使用 subjects 配置与 intelligence 入口；旧 games 配置仅作为兼容输入自动迁移。Facebook 采集仍遵循可靠的 Phase 1 → Phase 1.5 → Phase 2 流程，最终输出 communities、subjects、matches、evidence、XLSX 与 run manifest。不要把 synthetic benchmark 结果描述为生产准确率，也不要声称已支持 Facebook Groups 以外的数据源。
